[project]
name = "customer-churning-repo"
version = "0.1.0"
description = "Train and serve a customer churn prediction model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "httpx",
    "jinja2",
    "modal",
    "numpy",
    "pandas",
    "pytest",
    "python-multipart",
    "scikit-learn",
    "uvicorn",
]

[project.optional-dependencies]
notebook = [
    "matplotlib",
    "plotly",
    "seaborn",
]
